<style>
  :root{
    --cream:#FFF3DC; --paper:#FFFFFF; --ink:#1B2233;
    --blue:#3BC7F5; --yellow:#FFC93C; --pink:#EF4360; --grass:#5FC26E;
    --logo-blue:#29B6F6; --logo-pink:#EE3D77;
    --stroke:3px solid var(--ink); --lift:0 5px 0 var(--ink);
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:clip}
  img{max-width:100%;display:block}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:Fredoka,system-ui,sans-serif;font-weight:500;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:28px 16px 36px;
  }
  .mono{font-family:'Space Mono',monospace;letter-spacing:.04em}

  .logo{height:56px;width:auto;margin:0 auto 22px}
  @media(max-width:520px){.logo{height:42px;margin-bottom:18px}}

  .card{
    width:100%;max-width:560px;background:var(--paper);
    border:var(--stroke);border-radius:22px;box-shadow:var(--lift);
    overflow:hidden;
  }
  .stripe{
    height:26px;border-bottom:var(--stroke);
    background:repeating-linear-gradient(90deg,var(--logo-blue) 0 24px,var(--paper) 24px 48px);
  }

  /* CAG on stage */
  .stage{
    position:relative;background:var(--cream);border-bottom:var(--stroke);
    height:280px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  }
  .stage .floor{position:absolute;bottom:0;left:0;right:0;height:26%;background:var(--paper);border-top:var(--stroke)}
  .stage img{
    position:relative;width:272px;margin-bottom:-6px;
    transform-origin:bottom center;animation:snooze 4.5s ease-in-out infinite;
    filter:drop-shadow(0 6px 0 rgba(27,34,51,.15));
  }
  @keyframes snooze{
    0%,100%{transform:scale(1) rotate(0deg)}
    50%{transform:scale(1.035) rotate(-1.2deg)}
  }
  @media(max-width:520px){.stage{height:236px}.stage img{width:222px}}

  /* text */
  .body{padding:22px 26px 26px;text-align:center}
  .tag{
    display:inline-block;background:var(--ink);color:var(--yellow);
    font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.06em;
    border:2px solid var(--ink);border-radius:999px;padding:4px 12px;box-shadow:2px 2px 0 var(--ink);
  }
  h1{margin:16px 0 0;font-size:38px;font-weight:700;line-height:1.05}
  @media(max-width:520px){h1{font-size:30px}.body{padding:20px 18px 24px}}
  .lead{margin:12px 0 0;font-size:17px;color:#5b6172;line-height:1.45}
  .lead b{color:var(--ink)}

  .drop{
    margin:20px auto 0;background:var(--yellow);border:var(--stroke);border-radius:999px;
    box-shadow:0 4px 0 var(--ink);padding:10px 22px;display:inline-block;
    font-size:19px;font-weight:700;
  }
  .drop span{color:var(--logo-pink)}

  .cta{margin:20px 0 0;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
  .cta .drop{margin:0}
  .wp{
    font-size:16px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap;
    transition:color .12s ease;
  }
  .wp:hover,.wp:focus-visible{color:var(--logo-pink)}
  @media(max-width:520px){.cta{gap:14px}}

  .note{margin:18px 0 0;font-family:'Space Mono',monospace;font-size:12px;color:#8a8f9c}

  footer{margin-top:22px;font-family:'Space Mono',monospace;font-size:11px;color:#a29a8a;letter-spacing:.04em}

  @media(prefers-reduced-motion:reduce){.stage img{animation:none}}
</style>
</head>
