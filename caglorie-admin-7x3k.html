<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAGlorie · Admin</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>
<style>
:root{--ink:#1b2233;--paper:#fff;--cream:#fff7e6;--yellow:#ffc933;--pink:#ff4f8b;--blue:#4aa8ff;--stroke:2.5px solid var(--ink);--lift:0 5px 0 var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
h1{margin:0 0 4px;font-size:26px}h1 small{font-weight:400;font-size:14px;color:#5b6172;margin-left:10px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
input,select,button{font:inherit;border:var(--stroke);border-radius:12px;padding:9px 12px;background:var(--paper)}
button{cursor:pointer;box-shadow:0 3px 0 var(--ink);font-weight:700}button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button.p{background:var(--yellow)}button.d{background:var(--pink);color:#fff}button:disabled{opacity:.45;cursor:default}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0 18px}
.card{background:var(--paper);border:var(--stroke);border-radius:14px;padding:12px 14px;box-shadow:var(--lift)}
.card .k{font-size:11px;letter-spacing:.08em;color:#5b6172}.card .v{font-size:20px;font-weight:700;margin-top:2px}
table{width:100%;border-collapse:collapse;background:var(--paper);border:var(--stroke);border-radius:14px;overflow:hidden;box-shadow:var(--lift)}
th,td{padding:9px 10px;border-bottom:1.5px solid #e6e1d6;text-align:left;font-size:14px}th{background:#f3eee2;font-size:12px;letter-spacing:.06em}
td.r,th.r{text-align:right}tr.unq td{color:#9a9a9a}tr.ban td{color:#c33;text-decoration:line-through}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink);margin-left:6px}
.ok{background:#c6f2d0}.no{background:#ffd9d9}.ctr{background:#ffe7a8}
#msg{margin:10px 0;color:#5b6172}
.right{margin-left:auto}
</style></head><body><div class="wrap">
<h1>CAGlorie · Admin <small class="mono" id="addr"></small></h1>
<div class="bar">
  <label>Week <input id="week" type="number" min="0" style="width:90px"></label>
  <button id="load" class="p">Load</button>
  <button id="csv">Download CSV</button>
  <span class="right"></span>
  <button id="connect">Connect owner wallet (ban)</button>
</div>
<div id="msg">Loading…</div>
<div class="cards" id="cards"></div>
<table><thead><tr><th>#</th><th>Name</th><th>Wallet</th><th class="r">Calories</th><th class="r">Share</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</div>
<script>
const CONTRACT='0x9C9136C2003315f937e11aeFBe6A98c8Ca8cA525';
const ABI=[{"inputs":[{"internalType":"address","name":"_cag","type":"address"},{"internalType":"address","name":"_nft","type":"address"},{"internalType":"address","name":"_treasury","type":"address"},{"internalType":"uint256[4]","name":"_calMin","type":"uint256[4]"},{"internalType":"uint256[4]","name":"_calMax","type":"uint256[4]"},{"internalType":"uint256[3]","name":"_supersizePrice","type":"uint256[3]"},{"internalType":"uint256","name":"_chocolatePrice","type":"uint256"},{"internalType":"uint256","name":"_minCalories","type":"uint256"},{"internalType":"uint256","name":"_announcedPool","type":"uint256"}],"stateMutability":"nonpayable","type":"constructor"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"player","type":"address"},{"indexed":false,"internalType":"bool","name":"banned","type":"bool"}],"name":"Banned","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"player","type":"address"},{"indexed":false,"internalType":"uint256","name":"price","type":"uint256"}],"name":"ChocolateBought","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"player","type":"address"},{"indexed":true,"internalType":"uint256","name":"week","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"}],"name":"Claimed","type":"event"},{"anonymous":false,"inputs":[],"name":"ConfigUpdated","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"player","type":"address"},{"indexed":false,"internalType":"uint8","name":"food","type":"uint8"},{"indexed":false,"internalType":"uint256","name":"cal","type":"uint256"},{"indexed":true,"internalType":"uint256","name":"week","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"weekTotal","type":"uint256"},{"indexed":false,"internalType":"bool","name":"doubled","type":"bool"}],"name":"Fed","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"player","type":"address"},{"indexed":false,"internalType":"string","name":"name","type":"string"}],"name":"NameSet","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"uint256","name":"week","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"amount","type":"uint256"},{"indexed":false,"internalType":"uint256","name":"total","type":"uint256"}],"name":"PoolFunded","type":"event"},{"anonymous":false,"inputs":[{"indexed":true,"internalType":"address","name":"player","type":"address"},{"indexed":false,"internalType":"uint8","name":"food","type":"uint8"},{"indexed":false,"internalType":"uint256","name":"price","type":"uint256"}],"name":"Supersized","type":"event"},{"inputs":[],"name":"BIG_ORDER","outputs":[{"internalType":"uint8","name":"","type":"uint8"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"CHOCOLATE","outputs":[{"internalType":"uint8","name":"","type":"uint8"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"MEAL","outputs":[{"internalType":"uint8","name":"","type":"uint8"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"SNACK","outputs":[{"internalType":"uint8","name":"","type":"uint8"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"WEEK","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"","type":"address"}],"name":"allTimeCalories","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"announcedPool","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"","type":"address"}],"name":"banned","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"buyChocolate","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"cag","outputs":[{"internalType":"contract IERC20","name":"","type":"address"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"calMax","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"calMin","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"","type":"address"}],"name":"chocolateOwned","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"chocolatePrice","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"week","type":"uint256"}],"name":"claim","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"claimWeeks","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"player","type":"address"},{"internalType":"uint256","name":"week","type":"uint256"}],"name":"claimable","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"},{"internalType":"address","name":"","type":"address"}],"name":"claimed","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"player","type":"address"},{"internalType":"uint8","name":"food","type":"uint8"}],"name":"cooldownLeft","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"cooldowns","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"currentWeek","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"week","type":"uint256"}],"name":"displayPool","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint8","name":"food","type":"uint8"}],"name":"feed","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"week","type":"uint256"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"fundPool","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"genesis","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"getConfig","outputs":[{"internalType":"uint256[4]","name":"_calMin","type":"uint256[4]"},{"internalType":"uint256[4]","name":"_calMax","type":"uint256[4]"},{"internalType":"uint256[4]","name":"_cooldowns","type":"uint256[4]"},{"internalType":"uint256[4]","name":"_supersizePrice","type":"uint256[4]"},{"internalType":"uint256","name":"_chocolatePrice","type":"uint256"},{"internalType":"uint256","name":"_minCalories","type":"uint256"},{"internalType":"uint256","name":"_week","type":"uint256"},{"internalType":"uint256","name":"_weekEnd","type":"uint256"},{"internalType":"uint256","name":"_pool","type":"uint256"},{"internalType":"uint256","name":"_qualifiedCalories","type":"uint256"},{"internalType":"uint256","name":"_now","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"week","type":"uint256"}],"name":"getLeaderboard","outputs":[{"internalType":"address[]","name":"players","type":"address[]"},{"internalType":"uint256[]","name":"cals","type":"uint256[]"},{"internalType":"string[]","name":"playerNames","type":"string[]"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"player","type":"address"}],"name":"getPlayer","outputs":[{"internalType":"uint256[4]","name":"_lastFed","type":"uint256[4]"},{"internalType":"bool[4]","name":"_supersized","type":"bool[4]"},{"internalType":"bool","name":"_chocolateOwned","type":"bool"},{"internalType":"bool","name":"_hasNft","type":"bool"},{"internalType":"string","name":"_name","type":"string"},{"internalType":"uint256","name":"_weekCal","type":"uint256"},{"internalType":"uint256","name":"_allTime","type":"uint256"},{"internalType":"uint256","name":"_claimableLastWeek","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"player","type":"address"}],"name":"hasNft","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"minCalories","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"","type":"address"}],"name":"names","outputs":[{"internalType":"string","name":"","type":"string"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"nft","outputs":[{"internalType":"contract IERC721","name":"","type":"address"}],"stateMutability":"view","type":"function"},{"inputs":[],"name":"owner","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"week","type":"uint256"}],"name":"playerCount","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"week","type":"uint256"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"recoverPool","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint8","name":"food","type":"uint8"}],"name":"requiresNft","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"pure","type":"function"},{"inputs":[{"internalType":"address","name":"_treasury","type":"address"},{"internalType":"address","name":"_nft","type":"address"}],"name":"setAddresses","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"address","name":"player","type":"address"},{"internalType":"bool","name":"isBanned","type":"bool"}],"name":"setBanned","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"_claimWeeks","type":"uint256"}],"name":"setClaimWeeks","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256[4]","name":"_cooldowns","type":"uint256[4]"}],"name":"setCooldowns","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256[4]","name":"_calMin","type":"uint256[4]"},{"internalType":"uint256[4]","name":"_calMax","type":"uint256[4]"},{"internalType":"uint256[3]","name":"_supersizePrice","type":"uint256[3]"},{"internalType":"uint256","name":"_chocolatePrice","type":"uint256"},{"internalType":"uint256","name":"_minCalories","type":"uint256"},{"internalType":"uint256","name":"_announcedPool","type":"uint256"}],"name":"setEconomy","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"string","name":"name","type":"string"}],"name":"setName","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint8","name":"food","type":"uint8"}],"name":"supersize","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"supersizePrice","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"newOwner","type":"address"}],"name":"transferOwnership","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"treasury","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"},{"internalType":"address","name":"","type":"address"}],"name":"weekCalories","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"week","type":"uint256"}],"name":"weekEndsAt","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"weekPool","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"weekQualifiedCalories","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}];
const RPC='https://api.roninchain.com/rpc', CHAIN_ID=2020, CHAIN_HEX='0x7e4';
const ro=new ethers.JsonRpcProvider(RPC,CHAIN_ID,{staticNetwork:true,batchMaxCount:1}), game=new ethers.Contract(CONTRACT,ABI,ro);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function rpc(fn,tries=6){ for(let i=0;;i++){ try{ const v=await fn(); await sleep(60); return v; }catch(e){ const m=(e.message||'')+(e.info?JSON.stringify(e.info):''); if(i<tries&&/429|Too many|SERVER_ERROR|rate/i.test(m)){ await sleep(400*(i+1)); continue; } throw e; } } }
const $=s=>document.querySelector(s); const fmt=v=>Math.floor(Number(ethers.formatUnits(v,18))).toLocaleString('en-US');
let signer=null, gameW=null, me=null, data=null;
$('#addr').textContent=CONTRACT;

async function load(){
  $('#msg').textContent='Reading contract…';
  const cfg=await rpc(()=>game.getConfig()); const cw=Number(cfg._week);
  let week=$('#week').value===''?cw:Number($('#week').value); $('#week').value=week;
  const [players,cals,names]=await rpc(()=>game.getLeaderboard(week));
  const pool=await rpc(()=>game.weekPool(week)), qual=await rpc(()=>game.weekQualifiedCalories(week)), min=Number(await rpc(()=>game.minCalories()));
  const ends=Number(await rpc(()=>game.weekEndsAt(week)))*1000;
  const rows=[];
  for(let i=0;i<players.length;i++){
    const a=players[i], cal=Number(cals[i]);
    $('#msg').textContent=`Reading player ${i+1} of ${players.length}…`;
    const claimed=await rpc(()=>game.claimed(week,a)), banned=await rpc(()=>game.banned(a)), code=await rpc(()=>ro.getCode(a));
    const isContract=code&&code!=='0x';
    const share=(cal>=min&&qual>0n)?pool*BigInt(cal)/qual:0n;
    rows.push({rank:0,name:names[i]||'',addr:a,cal,share,qualified:cal>=min,claimed,banned,isContract});
  }
  rows.sort((x,y)=>y.cal-x.cal); rows.forEach((r,i)=>r.rank=i+1);
  data={week,rows,pool,qual:Number(qual),min,cw,ends};
  render();
}
function render(){
  const d=data, status=d.week<d.cw?(d.cw>d.week+1?'closed · claim window over':'closed · claiming open'):'in progress';
  $('#msg').textContent=`Week ${d.week} · ${status} · ends ${new Date(d.ends).toUTCString()}`;
  const q=d.rows.filter(r=>r.qualified&&!r.banned), paid=d.rows.filter(r=>r.claimed).reduce((s,r)=>s+r.share,0n);
  $('#cards').innerHTML=[['POOL',fmt(d.pool)+' $CAG'],['PLAYERS',d.rows.length],['QUALIFIED',q.length],['QUALIFIED CAL',d.qual.toLocaleString('en-US')],['CLAIMED',fmt(paid)+' $CAG'],['MIN',d.min.toLocaleString('en-US')+' cal']]
    .map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  $('#rows').innerHTML=d.rows.map(r=>`<tr class="${r.banned?'ban':r.qualified?'':'unq'}">
    <td>${r.rank}</td><td>${esc(r.name)||'<i>no name</i>'}${r.isContract?'<span class="tag ctr">CONTRACT</span>':''}</td>
    <td class="mono"><a href="https://app.roninchain.com/address/${r.addr}" target="_blank" rel="noopener">${r.addr}</a></td>
    <td class="r mono">${r.cal.toLocaleString('en-US')}</td><td class="r mono">${r.qualified?fmt(r.share)+' $CAG':'—'}</td>
    <td>${r.banned?'<span class="tag no">BANNED</span>':r.claimed?'<span class="tag ok">CLAIMED</span>':r.qualified?'<span class="tag">pending</span>':'<span class="tag">below min</span>'}</td>
    <td>${signer?`<button class="${r.banned?'':'d'}" data-ban="${r.addr}" data-v="${r.banned?0:1}">${r.banned?'Unban':'Ban'}</button>`:''}</td></tr>`).join('') || '<tr><td colspan="7">No players this week.</td></tr>';
  document.querySelectorAll('[data-ban]').forEach(b=>b.onclick=()=>ban(b.dataset.ban,b.dataset.v==='1'));
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function csv(){
  if(!data) return;
  const lines=[['rank','name','wallet','calories','qualified','share_cag','claimed','banned','is_contract'].join(',')]
    .concat(data.rows.map(r=>[r.rank,`"${r.name.replace(/"/g,'""')}"`,r.addr,r.cal,r.qualified,ethers.formatUnits(r.share,18),r.claimed,r.banned,r.isContract].join(',')));
  lines.push('', `# week ${data.week}, pool ${ethers.formatUnits(data.pool,18)} CAG, qualified calories ${data.qual}, min ${data.min}, exported ${new Date().toISOString()}`);
  const blob=new Blob([lines.join('\n')],{type:'text/csv'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`caglorie_week${data.week}.csv`; a.click();
}
async function connect(){
  const inj=window.ethereum||window.ronin?.provider; if(!inj){ alert('No wallet found'); return; }
  const accounts=await inj.request({method:'eth_requestAccounts'});
  const cid=parseInt(await inj.request({method:'eth_chainId'}),16);
  if(cid!==CHAIN_ID){ try{ await inj.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN_HEX}]}); }catch{ alert('Switch the wallet to Ronin'); return; } }
  const p=new ethers.BrowserProvider(inj); signer=await p.getSigner(); me=ethers.getAddress(accounts[0]); gameW=game.connect(signer);
  const owner=await rpc(()=>game.owner());
  $('#connect').textContent=me.slice(0,6)+'…'+me.slice(-4)+(owner.toLowerCase()===me.toLowerCase()?' (owner)':' (NOT owner)');
  if(data) render();
}
async function ban(addr,v){
  if(!confirm(`${v?'Ban':'Unban'} ${addr}?`)) return;
  try{ $('#msg').textContent='Confirm in wallet…'; const tx=await gameW.setBanned(addr,v); $('#msg').textContent='Waiting for Ronin…'; await tx.wait(); await load(); }
  catch(e){ $('#msg').textContent=e.reason||e.shortMessage||e.message; }
}
$('#load').onclick=()=>load().catch(e=>{ $('#msg').textContent='Error: '+(e.reason||e.shortMessage||e.message); console.error(e); }); $('#csv').onclick=csv; $('#connect').onclick=connect;
if(typeof ethers==='undefined'){ $('#msg').textContent='Error: could not load ethers.js (no internet or blocked CDN).'; }
else load().catch(e=>{ $('#msg').textContent='Error: '+(e.reason||e.shortMessage||e.message); console.error(e); });
</script></body></html>
