<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAGlorie · Admin</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>
<style>
:root{--ink:#1b2233;--paper:#fff;--cream:#fff7e6;--yellow:#ffc933;--pink:#ff4f8b;--blue:#4aa8ff;--green:#5fc26e;--stroke:2.5px solid var(--ink);--lift:0 5px 0 var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
h1{margin:0;font-size:26px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.net{font-size:11px;letter-spacing:.08em;padding:3px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--yellow)}
.net.test{background:var(--blue);color:#fff}
input,select,button{font:inherit;border:var(--stroke);border-radius:12px;padding:9px 12px;background:var(--paper);color:inherit}
button{cursor:pointer;box-shadow:0 3px 0 var(--ink);font-weight:700}button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button.p{background:var(--yellow)}button.d{background:var(--pink);color:#fff}button:disabled{opacity:.45;cursor:default}
button.sm{padding:6px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.muted{color:#5b6172;font-size:13px}
#msg{margin:12px 0;color:#5b6172;min-height:20px}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 14px;border-bottom:var(--stroke);padding-bottom:12px}
.tabs button{background:var(--paper);box-shadow:0 3px 0 var(--ink)}
.tabs button.on{background:var(--ink);color:var(--cream)}
.tab{display:none}.tab.on{display:block}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0 0 18px}
.card{background:var(--paper);border:var(--stroke);border-radius:14px;padding:12px 14px;box-shadow:var(--lift)}
.card .k{font-size:11px;letter-spacing:.08em;color:#5b6172}.card .v{font-size:20px;font-weight:700;margin-top:2px}
.panel{background:var(--paper);border:var(--stroke);border-radius:14px;padding:16px;box-shadow:var(--lift);margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:17px}
.panel .sub{color:#5b6172;font-size:13px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row + .row{margin-top:10px;padding-top:10px;border-top:1.5px solid #e6e1d6}
.row label{font-size:13px;color:#5b6172}
.actions{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:14px;border-top:1.5px solid #e6e1d6}
.chg{color:#b8860b;font-size:13px;font-weight:700}

table{width:100%;border-collapse:collapse;background:var(--paper);border:var(--stroke);border-radius:14px;overflow:hidden;box-shadow:var(--lift)}
th,td{padding:9px 10px;border-bottom:1.5px solid #e6e1d6;text-align:left;font-size:14px;vertical-align:middle}
th{background:#f3eee2;font-size:12px;letter-spacing:.06em}
td.r,th.r{text-align:right}tr.unq td{color:#9a9a9a}tr.ban td{color:#c33;text-decoration:line-through}
table input{padding:6px 8px;border-radius:9px;border:2px solid var(--ink);width:88px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink);margin-left:6px}
.ok{background:#c6f2d0}.no{background:#ffd9d9}.ctr{background:#ffe7a8}
.warn{background:#ffe7a8;border:var(--stroke);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.drink{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.drink img{width:64px;height:64px;object-fit:contain;border:var(--stroke);border-radius:12px;background:var(--yellow)}
.dname{font-weight:700;font-size:16px}
</style></head><body><div class="wrap">

<div class="top">
  <h1>CAGlorie · Admin</h1>
  <span class="net" id="net"></span>
  <span class="mono muted" id="addr"></span>
  <span style="margin-left:auto"></span>
  <button id="connect">Connect owner wallet</button>
</div>
<div id="msg">Loading…</div>

<div class="tabs">
  <button data-tab="week" class="on">Week &amp; players</button>
  <button data-tab="food">Food</button>
  <button data-tab="drinks">Drinks</button>
  <button data-tab="pool">Prize pool</button>
  <button data-tab="advanced">Advanced</button>
</div>

<section class="tab on" id="tab-week">
  <div class="row" style="margin-bottom:14px">
    <label>Week <input id="week" type="number" min="0" style="width:90px"></label>
    <button id="load" class="p">Load</button>
    <button id="csv">Download CSV</button>
  </div>
  <div class="cards" id="cards"></div>
  <table><thead><tr><th>#</th><th>Name</th><th>Wallet</th><th class="r">Calories</th><th class="r">Share</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</section>

<section class="tab" id="tab-food"><div id="foodPanel"></div></section>
<section class="tab" id="tab-drinks"><div id="drinksPanel"></div></section>
<section class="tab" id="tab-pool"><div id="poolPanel"></div></section>
<section class="tab" id="tab-advanced"><div id="advPanel"></div></section>

</div>

async function load(){
  $('#msg').textContent='Reading contract…';
  const cfg=await rpc(()=>game.getConfig()); const cw=Number(cfg._week);
  let week=$('#week').value===''?cw:Number($('#week').value); $('#week').value=week;

  econ={ calMin:cfg._calMin.map(Number), calMax:cfg._calMax.map(Number),
         cooldowns:cfg._cooldowns.map(v=>Number(v)/3600), superPrice:cfg._supersizePrice.map(cag),
         chocolate:cag(cfg._chocolatePrice), minCal:Number(cfg._minCalories),
         announced:cag(await rpc(()=>game.announcedPool())) };

  const [players,cals,names]=await rpc(()=>game.getLeaderboard(week));
  const pool=await rpc(()=>game.weekPool(week)), qual=await rpc(()=>game.weekQualifiedCalories(week)), min=Number(cfg._minCalories);
  const ends=Number(await rpc(()=>game.weekEndsAt(week)))*1000;
  const claimWeeks=Number(await rpc(()=>game.claimWeeks()));
  if(!cagAddr) cagAddr=await rpc(()=>game.cag());
  const cagBal=await rpc(()=>new ethers.Contract(cagAddr,ERC20_ABI,ro).balanceOf(CONTRACT));
  adv={ claimWeeks, treasury:await rpc(()=>game.treasury()), nft:await rpc(()=>game.nft()),
        owner:await rpc(()=>game.owner()), cag:cagAddr, genesis:Number(await rpc(()=>game.genesis()))*1000 };

  const rows=[];
  for(let i=0;i<players.length;i++){
    const a=players[i], cal=Number(cals[i]);
    $('#msg').textContent=`Reading player ${i+1} of ${players.length}…`;
    const claimed=await rpc(()=>game.claimed(week,a)), banned=await rpc(()=>game.banned(a)), code=await rpc(()=>ro.getCode(a));
    const share=(cal>=min&&qual>0n)?pool*BigInt(cal)/qual:0n;
    rows.push({rank:0,name:names[i]||'',addr:a,cal,share,qualified:cal>=min,claimed,banned,isContract:code&&code!=='0x'});
  }
  rows.sort((x,y)=>y.cal-x.cal); rows.forEach((r,i)=>r.rank=i+1);
  data={week,rows,pool,qual:Number(qual),min,cw,ends,claimWeeks,cagBal};
  await loadDrinks(); await loadCollab();
  render();
}

async function loadDrinks(){
  drinks=null;
  try{
    const nftAddr=await rpc(()=>game.drinkNft());
    if(nftAddr===ethers.ZeroAddress){ drinks={collection:null,items:[]}; return; }
    const c=new ethers.Contract(nftAddr,DRINKS_ABI,ro);
    const ids=await rpc(()=>game.getDrinkIds());
    const items=[];
    for(const id of ids){
      const info=await rpc(()=>game.getDrinkInfo(id));
      const stock=Number(await rpc(()=>game.drinksInStock(id)));
      const max=Number(await rpc(()=>c.maxSupply(id))), total=Number(await rpc(()=>c.totalSupply(id)));
      let uri='', meta={};
      try{ uri=await rpc(()=>c.uri(id)); const r=await fetch(uri); if(r.ok) meta=await r.json(); }catch(e){}
      items.push({ id:Number(id), enabled:info[1], cMin:Number(info[2]), cMax:Number(info[3]),
                   cooldown:Number(info[4]), stock, max, total,
                   name:meta.name||('Drink #'+id), img:meta.game_image||meta.image||null, uri });
    }
    drinks={collection:nftAddr, items};
  }catch(e){ console.warn('drinks',e); drinks={error:(e.reason||e.shortMessage||e.message)}; }
}

async function loadCollab(){
  collab=null;
  try{
    const r=await rpc(()=>game.getCollabRules()), i=await rpc(()=>game.getCollabInfo());
    collab={ enabled:r[0], gate:r[1], gateType:Number(r[2]), gateId:Number(r[3]), minAmount:Number(r[4]),
             cMin:Number(r[5]), cMax:Number(r[6]), cooldown:Number(r[7])/3600, superPrice:cag(r[8]),
             name:i[0], icon:i[1], partner:i[2], partnerLink:i[3], condition:i[4] };
  }catch(e){ console.warn('collab',e); }
}

function economyDiff(){
  const e=econ;
  const calMin=[0,1,2,3].map(i=>val(`[data-fmin="${i}"]`)), calMax=[0,1,2,3].map(i=>val(`[data-fmax="${i}"]`));
  const cds=[0,1,2,3].map(i=>val(`[data-fcd="${i}"]`)), sps=[0,1,2].map(i=>val(`[data-fsp="${i}"]`));
  const choc=val('#ecChoc'), minCal=val('#ecMin'), ann=val('#ecAnn');
  const econChanged = calMin.some((v,i)=>v!==e.calMin[i]) || calMax.some((v,i)=>v!==e.calMax[i])
    || sps.some((v,i)=>v!==e.superPrice[i]) || choc!==e.chocolate || minCal!==e.minCal || ann!==e.announced;
  const cdChanged = cds.some((v,i)=>v!==e.cooldowns[i]);
  return {calMin,calMax,cds,sps,choc,minCal,ann,econChanged,cdChanged};
}
function describeEconomy(){
  const d=economyDiff(), parts=[];
  if(d.econChanged) parts.push('calories, prices and minimum');
  if(d.cdChanged) parts.push('cooldowns');
  $('#ecWhat').innerHTML = parts.length
    ? `<span class="chg">${parts.length} transaction${parts.length>1?'s':''}: ${parts.join(' + ')}</span>`
    : 'No changes yet.';
}
async function saveEconomy(){
  const d=economyDiff();
  if(!d.econChanged&&!d.cdChanged) return alert('Nothing changed');
  for(let i=0;i<4;i++) if(!(d.calMin[i]>0&&d.calMax[i]>=d.calMin[i])) return alert(`Check the calories for ${FOODS[i]}`);
  if(d.cds.some(v=>!(v>0))) return alert('Cooldowns must be greater than zero');
  if(!confirm(`Save the changes? ${[d.econChanged&&'economy',d.cdChanged&&'cooldowns'].filter(Boolean).join(' + ')}`)) return;
  const wei=n=>ethers.parseUnits(String(n),18);
  if(d.econChanged) await tx('Saving the economy', ()=>gameW.setEconomy(d.calMin,d.calMax,d.sps.map(wei),wei(d.choc),d.minCal,wei(d.ann)), !d.cdChanged);
  if(d.cdChanged) await tx('Saving the cooldowns', ()=>gameW.setCooldowns(d.cds.map(h=>Math.round(h*3600))));
}

function recoverState(){
  const d=data;
  if(d.week>=d.cw) return {ok:false, why:'the week is still running'};
  if(d.qual===0) return {ok:true, why:'nobody qualified, recoverable now'};
  if(d.cw>d.week+d.claimWeeks) return {ok:true, why:'claim window closed'};
  return {ok:false, why:`players can still claim until week ${d.week+d.claimWeeks+1}`};
}

        <input id="recAmt" type="number" min="0" step="1000" placeholder="${Math.floor(cag(d.pool))}" ${dis}><span class="muted">$CAG · goes to the owner wallet</span>
        <button class="d" id="recBtn" ${locked()||!rec.ok?'disabled':''}>Recover</button>
        <span class="${rec.ok?'muted':'chg'}">${rec.ok?'✓ '+rec.why:'blocked · '+rec.why}</span>
      </div>
      ${lockNote()}
    </div>`;
  if(locked()) return;
  $('#fundBtn').onclick=fundPool;
  if(rec.ok) $('#recBtn').onclick=recoverPool;
}

// ================================================================ acciones
async function tx(label, fn, reload=true){
  try{
    $('#msg').textContent=label+' · confirm in wallet…';
    const t=await fn();
    $('#msg').textContent='Waiting for Ronin…';
    await t.wait();
    if(reload) await load(); else $('#msg').textContent='Done.';
  }catch(e){ $('#msg').textContent='Error: '+(e.reason||e.shortMessage||e.message); console.error(e); }
}
const drinksW=()=>new ethers.Contract(drinks.collection,DRINKS_ABI,signer);
async function ban(addr,v){ if(!confirm(`${v?'Ban':'Unban'} ${addr}?`)) return; tx(v?'Banning':'Unbanning', ()=>gameW.setBanned(addr,v)); }
async function fundPool(){
  const n=val('#fundAmt'); if(!(n>0)) return alert('Enter an amount');
  const amount=ethers.parseUnits(String(n),18);
  const c=new ethers.Contract(cagAddr,ERC20_ABI,signer);
  const allow=await rpc(()=>c.allowance(me,CONTRACT));
  if(allow<amount){
    if(!confirm(`First you need to approve ${n.toLocaleString('en-US')} $CAG. Two transactions in total. Continue?`)) return;
    await tx('Approving $CAG', ()=>c.approve(CONTRACT,amount), false);
  }
  if(!confirm(`Fund week ${data.week} with ${n.toLocaleString('en-US')} $CAG?`)) return;
  tx('Funding the pool', ()=>gameW.fundPool(data.week,amount));
}
async function recoverPool(){
  const n=val('#recAmt'); if(!(n>0)) return alert('Enter an amount');
  if(!confirm(`Recover ${n.toLocaleString('en-US')} $CAG from week ${data.week}?`)) return;
  tx('Recovering', ()=>gameW.recoverPool(data.week,ethers.parseUnits(String(n),18)));
}
async function withdrawDrinks(id,n){ if(!confirm(`Withdraw ${n} unit(s) of drink #${id} to your wallet?`)) return; tx('Withdrawing drinks', ()=>gameW.withdrawDrinks(me,id,n)); }
async function mintDrink(id){
  const n=val(`[data-mintamt="${id}"]`); if(!(n>0)) return alert('Enter an amount');
  if(!confirm(`Mint ${n} unit(s) of drink #${id} to your wallet?`)) return;
  tx('Minting', ()=>drinksW().mint(me,id,n));
}
async function raiseCap(id){ const n=val(`[data-capamt="${id}"]`); if(!(n>0)) return alert('Enter the new cap'); tx('Raising the cap', ()=>drinksW().setMaxSupply(id,n)); }
async function saveDrink(id,enabledOverride){
  const d=drinks.items.find(x=>x.id===id);
  const cMin=val(`[data-cmin="${id}"]`), cMax=val(`[data-cmax="${id}"]`), hours=val(`[data-cd="${id}"]`);
  const enabled=enabledOverride===null?d.enabled:enabledOverride;
  if(!(cMin>0&&cMax>=cMin&&hours>0)) return alert('Check the numbers');
  tx('Saving the drink', ()=>gameW.setDrink(id,cMin,cMax,Math.round(hours*3600),enabled));
}
async function createDrink(){
  const id=val('#ndId'), uri=txt('#ndUri'), max=val('#ndMax');
  if(!(id>0)||!uri||!(max>0)) return alert('Complete the three fields');
  if(!/^(https?|ipfs):\/\//i.test(uri)) return alert('The json URL looks wrong');
  if(!confirm(`Create drink #${id} with a cap of ${max}?\n\n${uri}`)) return;
  tx('Creating the drink', ()=>drinksW().createDrink(id,uri,max));
}
function csv(){
  if(!data) return;
  const lines=[['rank','name','wallet','calories','qualified','share_cag','claimed','banned','is_contract'].join(',')]
    .concat(data.rows.map(r=>[r.rank,`"${r.name.replace(/"/g,'""')}"`,r.addr,r.cal,r.qualified,ethers.formatUnits(r.share,18),r.claimed,r.banned,r.isContract].join(',')));
  lines.push('', `# week ${data.week}, pool ${ethers.formatUnits(data.pool,18)} CAG, qualified calories ${data.qual}, min ${data.min}, exported ${new Date().toISOString()}`);
  const blob=new Blob([lines.join('\n')],{type:'text/csv'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`caglorie_week${data.week}.csv`; a.click();
}
async function connect(){
  const inj=window.ronin?.provider||window.ethereum; if(!inj){ alert('No wallet found'); return; }
  const accounts=await inj.request({method:'eth_requestAccounts'});
  const cid=parseInt(await inj.request({method:'eth_chainId'}),16);
  if(cid!==CHAIN_ID){ try{ await inj.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN_HEX}]}); }catch{ alert('Switch the wallet to the right network'); return; } }
  const p=new ethers.BrowserProvider(inj); signer=await p.getSigner(); me=ethers.getAddress(accounts[0]); gameW=game.connect(signer);
  isOwner=(await rpc(()=>game.owner())).toLowerCase()===me.toLowerCase();
  $('#connect').textContent=me.slice(0,6)+'…'+me.slice(-4)+(isOwner?' (owner)':' (NOT owner)');
  if(data) render();
}
$('#load').onclick=()=>load().catch(e=>{ $('#msg').textContent='Error: '+(e.reason||e.shortMessage||e.message); console.error(e); });
$('#csv').onclick=csv; $('#connect').onclick=connect;
if(typeof ethers==='undefined'){ $('#msg').textContent='Error: could not load ethers.js (no internet or blocked CDN).'; }
else load().catch(e=>{ $('#msg').textContent='Error: '+(e.reason||e.shortMessage||e.message); console.error(e); });
</script></body></html>
